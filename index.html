<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TARU ARMY</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% 42%, #eee9ff 0%, #f7f6fb 32%, #ffffff 70%);
    overflow:hidden;
}

.page{
    width:min(88%, 390px);
    padding:42px 28px 30px;
    background:rgba(255,255,255,.88);
    border:1px solid rgba(120,90,220,.08);
    border-radius:38px;
    box-shadow:
        0 25px 70px rgba(70,45,150,.13),
        inset 0 1px 0 rgba(255,255,255,.9);
    text-align:center;
    position:relative;
}

/* IMAGE */
.profile-wrap{
    width:174px;
    height:174px;
    margin:0 auto 28px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.profile-wrap::before{
    content:"";
    position:absolute;
    inset:-13px;
    border-radius:50%;
    background:linear-gradient(
        135deg,
        #d9ecff,
        #ffffff,
        #eadcff,
        #ffe8dd
    );
    box-shadow:
        0 0 0 2px #fff,
        0 8px 30px rgba(111,74,220,.18);
}

.profile-wrap::after{
    content:"";
    position:absolute;
    inset:-27px;
    border:2px dashed rgba(111,84,215,.16);
    border-radius:50%;
}

.profile{
    width:154px;
    height:154px;
    border-radius:50%;
    object-fit:cover;
    position:relative;
    z-index:2;
    border:7px solid white;
    box-shadow:0 8px 25px rgba(70,50,130,.2);
}

/* VERIFIED */
.verify{
    position:absolute;
    z-index:4;
    right:-3px;
    bottom:8px;
    width:43px;
    height:43px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#7251e8,#8c5df4);
    color:white;
    font-size:24px;
    font-weight:bold;
    border:4px solid white;
    box-shadow:0 8px 18px rgba(101,70,220,.3);
}

/* SMALL DOT */
.dot{
    position:absolute;
    z-index:5;
    right:-28px;
    top:34px;
    width:13px;
    height:13px;
    border-radius:50%;
    background:#7554e8;
    box-shadow:0 0 15px rgba(117,84,232,.5);
}

/* HEADLINE */
h1{
    color:#30226c;
    font-family:Georgia,serif;
    font-size:38px;
    letter-spacing:2px;
    margin:4px 0 12px;
    text-transform:uppercase;
}

.line{
    width:105px;
    height:4px;
    margin:0 auto 32px;
    border-radius:10px;
    background:linear-gradient(
        90deg,
        #b8dcff,
        #8bd5cf,
        #e6d5bd
    );
}

/* BUTTON */
.join-btn{
    width:100%;
    min-height:74px;
    border:0;
    border-radius:26px;
    cursor:pointer;
    color:#fff;
    font-size:20px;
    font-weight:700;
    letter-spacing:.3px;
    background:linear-gradient(
        135deg,
        #7045df,
        #8355ed,
        #7044dc
    );
    box-shadow:
        0 14px 28px rgba(105,67,220,.28),
        inset 0 1px 0 rgba(255,255,255,.25);
    transition:.18s ease;
    position:relative;
    overflow:hidden;
}

.join-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:70%;
    height:100%;
    background:linear-gradient(
        100deg,
        transparent,
        rgba(255,255,255,.28),
        transparent
    );
    transform:skewX(-20deg);
    animation:shine 3s infinite;
}

.join-btn:active{
    transform:scale(.97);
}

.telegram{
    font-size:25px;
    margin-right:10px;
    vertical-align:-2px;
}

.note{
    margin-top:17px;
    font-size:12px;
    color:#aaa4b8;
}

/* ANIMATION */
@keyframes shine{
    0%{left:-100%}
    45%,100%{left:140%}
}

@media(max-width:420px){
    .page{
        width:90%;
        padding:38px 22px 27px;
    }

    .profile-wrap{
        width:160px;
        height:160px;
    }

    .profile{
        width:142px;
        height:142px;
    }

    h1{
        font-size:32px;
    }
}
</style>

<script>
